[package]
name = "async-oauth2"
version = "0.6.1"
authors = [
  "Alex Crichton <alex@alexcrichton.com>",
  "Florin Lipan <florinlipan@gmail.com>",
  "David A. Ramos <ramos@cs.stanford.edu>",
  "John-John Tedro <udoprog@tedro.se>"
]
edition = "2021"
rust-version = "1.95"
description = "An asynchronous OAuth2 flow implementation."
documentation = "https://docs.rs/async-oauth2"
readme = "README.md"
homepage = "https://github.com/udoprog/async-oauth2"
repository = "https://github.com/udoprog/async-oauth2"
license = "MIT OR Apache-2.0"
keywords = ["auth", "oauth2"]
categories = ["authentication", "web-programming"]

[features]
default = ["reqwest", "rand", "alloc"]
reqwest = ["dep:reqwest", "dep:http"]
rand = ["dep:rand"]
alloc = ["serde/alloc", "serde_json/alloc", "base64/alloc"]

[lib]
name = "oauth2"
path = "src/lib.rs"

[dependencies]
base64 = { version = "0.22.0", default-features = false }
rand = { version = "0.10.1", optional = true }
serde = { version = "1.0.197", default-features = false, features = ["derive"] }
serde_json = { version = "1.0.115", default-features = false }
sha2 = { version = "0.11.0", default-features = false }
url = { version = "2.5.4", default-features = false }
reqwest = { version = "0.13.3", optional = true }
http = { version = "1.1.0", optional = true }
bytes = { version = "1.6.0", default-features = false }

[dev-dependencies]
tokio = { version = "1.26.0", features = ["full"] }

[workspace]
members = ["examples"]
